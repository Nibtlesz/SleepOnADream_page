# Cada hora: trae al sitio publicado los conciertos de Bandsintown y los lanzamientos nuevos
# de Apple Music / Spotify.
# Requiere en GitHub → Settings → Secrets and variables → Actions:
#   SITE_URL     URL pública del sitio, p. ej. https://sleeponadream.mx
#   CRON_SECRET  el mismo valor que la variable CRON_SECRET del servidor
# Mientras falte alguno, el trabajo termina sin hacer nada.
name: Sincronizar conciertos y música

on:
  schedule:
    - cron: "17 * * * *" # cada hora, al minuto 17
  workflow_dispatch: # botón "Run workflow" para sincronizar a mano

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a las tareas de sincronización
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Faltan los secretos SITE_URL o CRON_SECRET: no se sincroniza."
            exit 0
          fi
          status=0
          for task in sync-bandsintown sync-music; do
            echo "→ $task"
            curl --fail-with-body --silent --show-error --max-time 120 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "${SITE_URL%/}/api/cron/$task" || status=1
            echo
          done
          exit $status
